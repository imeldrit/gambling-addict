# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Skip Loom's remapped-variant pipeline. With identity mappings (see build.gradle)
# remapping is a no-op anyway, and Loom otherwise chokes trying to remap
# fabric-api's -sources.jar, which is an IDE convenience we don't need to compile.
fabric.loom.disableRemappedVariants=true

# ─────────────────────────────────────────────────────────────────────────────
# Minecraft / toolchain versions — verified against fabric-meta and Mojang's
# version manifest on 2026-09-10.
#
#   MC 26.1 released 2026-03-24 and requires Java 25.
#   There are NO Yarn mappings for 26.x — the newest is 1.21.11+build.6 — and
#   fabric-meta reports intermediary "0.0.0" for 26.1, the sentinel meaning
#   "no intermediary, uses Mojang official mappings". The 26.1 client jar ships
#   unobfuscated, so there is nothing to deobfuscate. See build.gradle.
# ─────────────────────────────────────────────────────────────────────────────
minecraft_version=26.1
loader_version=0.19.5

# Java release. MC 26.1's manifest declares javaVersion.majorVersion = 25.
java_version=25

# Mod identity
mod_version=2.0.0
maven_group=com.eldrit
archives_base_name=gamblingaddict

# Fabric API — newest build tagged +26.1 on maven.fabricmc.net
fabric_version=0.145.1+26.1
